<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>חוזרים מהחדרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* The breakdown the audience sees when the rooms close: one tile per proposal, the rooms that put it in the sprint,
   and what each room wrote. Read only: it holds no key. Looks like slide 17g of the deck (deck.html, s17g). */
:root { --s-bg: #F9F9F9; --s-ink: #343434; --s-mute: #8A8A8A; --s-faint: #C4C4C4; --s-line: #DEDEDE; --s-accent: #FF6393; --s-on-accent: #222222; --s-surface: #FFFFFF;
  --f-ui: "Heebo", "Arial Hebrew", "Segoe UI", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--s-bg); color: var(--s-ink); font-family: var(--f-ui); overflow: hidden; }
p, h1 { margin: 0; }
.stagebox { container-type: inline-size; width: min(100vw, 177.78vh); margin: 0 auto; height: 100%; display: grid; align-items: center; }
.stage { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; direction: rtl; padding: 3cqw 5cqw 1.6cqw;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.5cqw; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2cqw; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 2.3cqw; height: 2.1cqw; padding: 0 .85cqw; border-radius: 1.5cqw;
  background: var(--s-ink); color: var(--s-bg); font-size: 1.15cqw; font-weight: 700; width: max-content; }
.chip.hot { background: var(--s-accent); color: var(--s-on-accent); }
h1 { font-size: 3.5cqw; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin-top: .7cqw; }
h1 .pk { color: var(--s-accent); }
.cnt { font-size: 1.5cqw; font-weight: 500; color: var(--s-mute); padding-bottom: .5cqw; }
.cnt b { color: var(--s-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 26cqw; gap: 2.2cqw; min-height: 0; }
.main.solo { grid-template-columns: minmax(0, 1fr); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1.3cqw; min-height: 0; }
.tile { border-radius: 1cqw; box-shadow: inset 0 0 0 .14cqw var(--s-line); padding: 1cqw 1.2cqw; display: grid; gap: .45cqw; align-content: start; min-width: 0; min-height: 0; overflow: hidden; }
.pch { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; }
.pd { display: flex; align-items: baseline; gap: .5cqw; font-size: 1.05cqw; color: var(--s-mute); }
.pd b { font-size: 1.6cqw; font-weight: 800; color: var(--s-ink); font-variant-numeric: tabular-nums; }
.tn { font-size: 1.45cqw; font-weight: 700; line-height: 1.25; }
.tc { font-size: 1.15cqw; color: var(--s-mute); display: flex; align-items: baseline; gap: .5cqw; }
.tc b { font-size: 2.6cqw; line-height: 1; font-weight: 800; color: var(--s-ink); font-variant-numeric: tabular-nums; }
.tc.zero b { color: var(--s-faint); }
.rows { display: grid; gap: .4cqw; }
.pr { display: grid; grid-template-columns: 4.7cqw minmax(0, 1fr); gap: .5cqw; align-items: start; }
.pr > span { font-size: .95cqw; color: var(--s-mute); line-height: 1.9cqw; white-space: nowrap; }
.ps { display: flex; flex-wrap: wrap; gap: .35cqw; }
/* The one rule, the same as in the room page: solid pink fits in the sprint, hatch with a dashed edge rolls over. */
.p { font: inherit; min-width: 1.9cqw; height: 1.9cqw; padding: 0 .35cqw; border-radius: 1cqw; border: .12cqw solid transparent; background: var(--s-accent); color: var(--s-on-accent);
  font-size: 1.05cqw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; display: grid; place-items: center; cursor: pointer; transition: opacity .16s ease-out; }
.p.roll { color: var(--s-ink); border: .12cqw dashed var(--s-ink); background: repeating-linear-gradient(-45deg, rgba(52,52,52,.3) 0 .12cqw, transparent .12cqw .42cqw); }
.has-sel .p:not(.sel) { opacity: .25; }
.p.sel { box-shadow: 0 0 0 .16cqw var(--s-ink); }
.p:focus-visible, .ni:focus-visible, .mini button:focus-visible { outline: .16cqw solid var(--s-ink); outline-offset: .16cqw; }
.notes { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .7cqw; }
.nh { font-size: 1.15cqw; font-weight: 700; color: var(--s-mute); }
.nl { overflow-y: auto; display: grid; gap: .6cqw; align-content: start; padding-inline-end: .3cqw; scrollbar-width: thin; }
.ni { font: inherit; text-align: start; border: 0; background: var(--s-surface); color: var(--s-ink); border-radius: .8cqw; padding: .7cqw .9cqw; display: grid; gap: .25cqw; cursor: pointer;
  box-shadow: inset 0 0 0 .1cqw var(--s-line); min-width: 0; }
.ni.sel { box-shadow: inset 0 0 0 .16cqw var(--s-ink); }
.nr { display: flex; align-items: baseline; gap: .7cqw; flex-wrap: wrap; }
.ng { font-size: 1.2cqw; font-weight: 800; }
.no { font-size: 1.05cqw; font-weight: 500; color: var(--s-mute); font-variant-numeric: tabular-nums; }
.nt { font-size: 1.15cqw; line-height: 1.45; text-wrap: pretty; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.many .nt { -webkit-line-clamp: 1; }
.many .ni { padding-block: .5cqw; }
.ni.sel .nt { display: block; font-size: 1.35cqw; }
.foot { display: flex; align-items: baseline; justify-content: space-between; gap: 2cqw; font-size: .95cqw; color: var(--s-mute); }
.lg { display: flex; align-items: center; gap: .5cqw 1.4cqw; flex-wrap: wrap; }
.lg span { display: inline-flex; align-items: center; gap: .45cqw; }
.lg .p { cursor: default; min-width: 1.3cqw; height: 1.3cqw; }
.mini button { font: inherit; border: 0; background: none; color: var(--s-mute); text-decoration: underline; text-underline-offset: .2em; cursor: pointer; padding: 0; }
.demo { color: var(--s-ink); font-weight: 700; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .p { transition: none; } }
</style>
</head>
<body>
<div class="stagebox"><div class="stage" id="stage">
  <div class="top">
    <div><span class="chip hot">חוזרים מהחדרים</span><h1>מה נכנס לספרינט, <span class="pk">ולמה</span>?</h1></div>
    <p class="cnt" id="cnt"></p>
  </div>
  <div class="main solo" id="main">
    <div class="tiles" id="tiles"></div>
    <div class="notes" id="notes" hidden><p class="nh">מה הקבוצות כתבו</p><div class="nl" id="nl"></div></div>
  </div>
  <div class="foot">
    <div class="lg"><span><i class="p">4</i>מספר החדר. מלא: נכנס לספרינט</span><span><i class="p roll">4</i>מתגלגל לספרינט הבא</span><span>לחיצה על חדר מסמנת אותו בכל ההצעות</span><span class="demo" id="demo" hidden>הדגמה, הנתונים מומצאים</span></div>
    <div class="mini"><button type="button" id="bDone">סיום, חזרה להרצאה</button> <span id="hint"></span></div>
  </div>
</div></div>
<script src="config.js"></script>
<script>
(function () {
  // The six proposals: key, letter, development days, short name. The source is deck.html (PK, HL and BOARD of slide 17g).
  var C = [["A", "א", 20, "תצוגה מקדימה של הלינק"], ["B", "ב", 20, "שורת מודעות קניות גדולה"], ["C", "ג", 30, "דף שמשתנה לפי החיפוש"],
           ["D", "ד", 5, "המילים שחיפשתם מודגשות"], ["E", "ה", 5, "עוד מודעה בתחתית"], ["F", "ו", 70, "סיכום של בינה מלאכותית, וצ'אט"]], CAP = 30, BY = {};
  C.forEach(function (c) { BY[c[0]] = c; });
  var DB = (window.GAME_DB || "").replace(/\/$/, ""), DEMO = /demo/.test(location.hash), $ = function (id) { return document.getElementById(id); };
  var ROOMS = [], SEL = 0, LAST = null;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // One room record becomes: its number, the proposals in order with priority and whether each rolls over, the days, the note.
  function parse(key, v) {
    var m = /^g([0-9]{1,2})$/.exec(key); if (!m || !v || typeof v.o !== "string") return null;
    var seen = {}, sum = 0, by = {}, list = [];
    v.o.split("").forEach(function (k) {
      if (!BY[k] || seen[k]) return; seen[k] = 1;
      var d = BY[k][2], inD = Math.max(0, Math.min(d, CAP - sum)); sum += d;
      by[k] = { p: list.length + 1, roll: inD === 0 }; list.push(k);
    });
    if (!list.length) return null;
    return { g: +m[1], by: by, list: list, sum: sum, w: typeof v.w === "string" ? v.w.trim().slice(0, 600) : "", t: +v.t || 0 };
  }
  function groups(n) { return n === 0 ? "אף קבוצה" : n === 1 ? "קבוצה אחת" : n + " קבוצות"; }
  function pick(g) { SEL = SEL === g ? 0 : g; draw(); if (SEL) { var x = $("nl").querySelector(".ni.sel"); if (x && x.scrollIntoView) x.scrollIntoView({ block: "nearest" }); } }
  function pill(r, k) {
    var b = el("button", "p" + (r.by[k].roll ? " roll" : "") + (SEL === r.g ? " sel" : ""), r.g); b.type = "button";
    b.title = "חדר " + r.g + ", עדיפות " + r.by[k].p; b.addEventListener("click", function () { pick(r.g); }); return b;
  }
  function draw() {
    var tiles = $("tiles"), nl = $("nl"); tiles.textContent = ""; nl.textContent = "";
    $("stage").classList.toggle("has-sel", !!SEL);
    C.forEach(function (c) {
      var k = c[0], inRooms = ROOMS.filter(function (r) { return r.by[k]; }), t = el("div", "tile"), h = el("div", "pch"), pd = el("p", "pd");
      h.appendChild(el("span", "chip", c[1])); pd.appendChild(el("b", "", c[2])); pd.appendChild(el("span", "", "ימי פיתוח")); h.appendChild(pd); t.appendChild(h);
      t.appendChild(el("p", "tn", c[3]));
      var tc = el("p", "tc" + (inRooms.length ? "" : " zero"));
      if (inRooms.length > 1) { tc.appendChild(el("b", "", inRooms.length)); tc.appendChild(el("span", "", "קבוצות")); } else tc.appendChild(el("span", "", groups(inRooms.length)));
      t.appendChild(tc);
      var rows = el("div", "rows");
      [[1, "עדיפות 1"], [2, "עדיפות 2"], [3, "3 ומעלה"]].forEach(function (pr) {
        var rs = inRooms.filter(function (r) { return pr[0] < 3 ? r.by[k].p === pr[0] : r.by[k].p >= 3; }); if (!rs.length) return;
        var row = el("div", "pr"), ps = el("div", "ps"); row.appendChild(el("span", "", pr[1])); rs.forEach(function (r) { ps.appendChild(pill(r, k)); }); row.appendChild(ps); rows.appendChild(row);
      });
      t.appendChild(rows); tiles.appendChild(t);
    });
    ROOMS.forEach(function (r) {
      var b = el("button", "ni" + (SEL === r.g ? " sel" : "")), top = el("div", "nr"); b.type = "button";
      top.appendChild(el("span", "ng", "חדר " + r.g));
      top.appendChild(el("span", "no", r.list.map(function (k) { return BY[k][1]; }).join(" ← ") + " · " + r.sum + " ימים" + (r.sum > CAP ? ", " + (r.sum - CAP) + " מתגלגלים" : "")));
      b.appendChild(top); if (r.w) b.appendChild(el("p", "nt", r.w));
      b.addEventListener("click", function () { pick(r.g); }); nl.appendChild(b);
    });
    $("notes").classList.toggle("many", ROOMS.length > 6); $("notes").hidden = !ROOMS.length; $("main").classList.toggle("solo", !ROOMS.length);
    var cnt = $("cnt"); cnt.textContent = "";
    if (!ROOMS.length) cnt.textContent = "עוד לא נשלחו החלטות";
    else if (ROOMS.length === 1) cnt.textContent = "קבוצה אחת שלחה";
    else { cnt.appendChild(el("b", "", ROOMS.length)); cnt.appendChild(document.createTextNode(" קבוצות שלחו")); }
  }
  function take(data) {
    var s = JSON.stringify(data || {}); if (s === LAST) return; LAST = s;
    ROOMS = Object.keys(data || {}).map(function (k) { return parse(k, data[k]); }).filter(Boolean).sort(function (a, b) { return a.g - b.g; });
    if (SEL && !ROOMS.some(function (r) { return r.g === SEL; })) SEL = 0;
    draw();
  }
  function poll() {
    if (!DB) return;
    fetch(DB + "/pub.json").then(function (r) { return r.json(); }).then(function (p) {
      var round = (p || {}).round; if (!round) { take({}); return; }
      return fetch(DB + "/rooms/" + round + ".json").then(function (r) { return r.json(); }).then(take);
    }).catch(function () {});
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && SEL) { SEL = 0; draw(); } });
  $("bDone").onclick = function () { window.close(); setTimeout(function () { $("hint").textContent = "סוגרים את הלשונית הזאת (⌘W) כדי לחזור להרצאה."; }, 400); };
  if (DEMO) {
    $("demo").hidden = false;
    take({ g1: { o: "DAE", w: "הלכנו על מה שעוזר למשתמש להחליט לפני שהוא לוחץ. המודעה בתחתית נכנסה כי היא זולה ולא מפריעה.", t: 1 },
           g2: { o: "BDE", w: "גוגל חיה מפרסומות. קודם ההכנסות, ואז חוויה.", t: 2 }, g3: { o: "C", w: "דף שמשתנה לפי החיפוש הוא השינוי היחיד שמשתמש באמת ירגיש. לקחנו את כל הספרינט בשבילו.", t: 3 },
           g4: { o: "FD", w: "הבינה המלאכותית היא העתיד. מתחילים עכשיו, גם אם זה ייקח יותר מספרינט אחד.", t: 4 }, g5: { o: "DEA", t: 5 },
           g6: { o: "ADE", w: "רצינו שלושה דברים קטנים שאפשר למדוד, במקום הימור אחד גדול.", t: 6 }, g7: { o: "BE", w: "שתי ההצעות של המודעות, ונשארו לנו 5 ימים פנויים לתיקונים.", t: 7 },
           g8: { o: "DB", t: 8 }, g9: { o: "CD", w: "התווכחנו הרבה. חצי מאיתנו רצו את הבינה המלאכותית.", t: 9 }, g10: { o: "EDA", w: "", t: 10 },
           g11: { o: "FA", w: "אם לא אנחנו, מישהו אחר יעשה את זה.", t: 11 }, g12: { o: "DAE", w: "קודם המשתמש.", t: 12 } });
  } else { draw(); poll(); setInterval(poll, 2000); }
})();
</script>
</body>
</html>
