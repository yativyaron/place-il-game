<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>המושגים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root { --s-bg: #F9F9F9; --s-ink: #343434; --s-mute: #8A8A8A; --s-faint: #C4C4C4; --s-line: #DEDEDE; --s-accent: #FF6393; --s-on-accent: #222222; --s-surface: #FFFFFF;
  --f-ui: "Heebo", "Arial Hebrew", "Segoe UI", Arial, sans-serif; color-scheme: light; }
html, body { margin: 0; background: var(--s-bg); color: var(--s-ink); font-family: var(--f-ui); }
body { padding-bottom: 64px; }
.phead { position: sticky; top: 0; z-index: 2; background: var(--s-bg); padding: 16px 18px 12px; display: grid; gap: 2px; border-bottom: 1px solid var(--s-line); }
.phead { direction: rtl; text-align: center; }
.phead .he { font-size: 19px; font-weight: 700; line-height: 1.35; }
.phead .sub { font-size: 15px; color: #686868; line-height: 1.4; }
.chips { max-width: 560px; margin: 0 auto; padding: 16px 16px 22px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; -webkit-overflow-scrolling: touch; }
.chip { border: 0; background: var(--s-surface); color: var(--s-ink); box-shadow: inset 0 0 0 1.5px var(--s-faint); border-radius: 16px; min-height: 56px; padding: 10px 14px; flex: 1 1 100%; text-align: center;
  font-size: 20px; font-weight: 500; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: background .16s ease-out, box-shadow .16s ease-out; }
.chip.short { flex: 1 1 28%; }
.chip[aria-pressed="true"] { background: var(--s-accent); color: var(--s-on-accent); box-shadow: none; font-weight: 700; }
.chip:focus-visible { outline: 2px solid var(--s-ink); outline-offset: 2px; }

.pfoot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--s-line); font-size: 15px; color: #686868; display: flex; justify-content: space-between; gap: 12px; background: var(--s-bg); }
.pfoot b { color: var(--s-ink); font-variant-numeric: tabular-nums; }
body.closed .chips { opacity: .4; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
</head>
<body>
<div class="phead">
  <div class="he" id="pHe">תלחץ על כל מושג שאתה לא בטוח לגביו</div>
  <div class="sub" id="pSub" hidden></div>
</div>
<div class="chips" id="chips"></div>
<div class="pfoot" dir="rtl"><span>סימנת <b id="mine">0</b></span><span id="saved"></span></div>
<script src="terms.js"></script>
<script src="config.js"></script>
<script>
(function () {
  // The participant page. No sign-in, no name. A random id lives in this browser only; a tap is sent at once.
  // Every 2 seconds the page reads the public state: is the game open, and which run is it. A new run clears old marks.
  var DB = (window.GAME_DB || "").replace(/\/$/, ""), T = window.GAME_TERMS, $ = function (id) { return document.getElementById(id); };
  function rid() { var a = "abcdefghijklmnopqrstuvwxyz0123456789", s = "", r = new Uint8Array(20); (window.crypto || window.msCrypto).getRandomValues(r); for (var i = 0; i < 20; i++) s += a[r[i] % 36]; return s; }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var cid = get("g02cid"), round = get("g02round"), mine = {};
  try { mine = JSON.parse(get("g02marks") || "{}"); } catch (e) {}
  if (!cid) { cid = rid(); set("g02cid", cid); }
  var order = T.map(function (_, i) { return i; }); for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = order[i]; order[i] = order[j]; order[j] = x; }
  var timer = null, state = "wait", everOpen = false, dirty = false, chips = {};
  function count() { $("mine").textContent = Object.keys(mine).length; }
  function paint() { Object.keys(chips).forEach(function (k) { chips[k].setAttribute("aria-pressed", mine[k] ? "true" : "false"); }); count(); }
  function show() {
    document.body.classList.toggle("closed", state === "closed");
    var sub = $("pSub");
    if (state === "closed") { $("pHe").textContent = "נסגר. מסתכלים על המסך."; sub.hidden = true; $("saved").textContent = ""; return; }
    $("pHe").textContent = "תלחץ על כל מושג שאתה לא בטוח לגביו";
    sub.hidden = state === "open"; if (state !== "open") sub.textContent = "המשחק עוד לא נפתח. אפשר כבר לסמן, וזה יישלח כשייפתח.";
  }
  function send() {
    timer = null; set("g02marks", JSON.stringify(mine));
    if (!DB || state !== "open" || !round) { dirty = true; return; }
    dirty = false;
    fetch(DB + "/votes/" + round + "/" + cid + ".json", { method: "PUT", body: JSON.stringify(mine) }).then(function (r) {
      if (!r.ok) { dirty = true; return; } $("saved").textContent = "נשמר";
    }).catch(function () { dirty = true; });
  }
  function poll() {
    if (!DB) return;
    fetch(DB + "/pub.json").then(function (r) { return r.json(); }).then(function (p) {
      p = p || {};
      if (p.round && p.round !== round) { round = p.round; set("g02round", round); mine = {}; set("g02marks", "{}"); everOpen = false; dirty = false; paint(); $("saved").textContent = ""; }
      var was = state;
      if (p.open === true) { state = "open"; everOpen = true; } else state = everOpen ? "closed" : "wait";
      if (state !== was) show();
      if (state === "open" && (dirty || was !== "open") && !timer) send();
    }).catch(function () {});
  }
  order.forEach(function (i) {
    var k = "t" + i, b = document.createElement("button"); b.className = "chip" + (T[i].length <= 5 ? " short" : ""); b.type = "button"; b.textContent = T[i]; chips[k] = b;
    b.addEventListener("click", function () {
      if (state === "closed") return;
      if (mine[k]) delete mine[k]; else mine[k] = 1;
      b.setAttribute("aria-pressed", mine[k] ? "true" : "false"); count(); $("saved").textContent = "";
      if (timer) clearTimeout(timer); timer = setTimeout(send, 350);
    });
    $("chips").appendChild(b);
  });
  paint(); show(); poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
